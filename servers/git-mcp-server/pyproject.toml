[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-mcp-server"
version = "0.1.0"
description = "Git MCP Server — read-only Git tools over MCP (Streamable HTTP), with native auth + Origin/Host protection"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13,<2.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.37.0,<1.0.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_mcp_server = ["py.typed"]
