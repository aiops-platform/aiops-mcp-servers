[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-ops-mcp-server"
version = "0.1.0"
description = "AIOps Deploy Ops MCP Server — 把某个 Deployment 滚到指定镜像，并如实回报结果（Streamable HTTP）"
requires-python = ">=3.11"
dependencies = [
    # ⚠️ mcp 必须 <2.0：AgentScope 2.0.3 按 mcp SDK **v1** 的 API 写
    # （`MCPTool` 读 `tool.inputSchema`），2.x 改成 `input_schema` 会让包装崩溃。
    # 与 aiops-datasource-mcp-server / git-mcp-server 保持同一区间。
    "mcp>=1.13,<2.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.37.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deploy_ops_mcp_server = ["py.typed"]
