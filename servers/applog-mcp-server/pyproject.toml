[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applog-mcp-server"
version = "0.1.0"
description = "Applog MCP Server — 按 config/tools.yaml 声明把多个 HTTP 日志查询接口自动注册成 MCP 只读工具（Streamable HTTP）"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13,<2.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.37.0,<1.0.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
applog_mcp_server = ["py.typed"]
